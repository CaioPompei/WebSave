name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Resumo do erro
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          linhas = open("build.log", errors="ignore").read().splitlines()
          chave = re.compile(r"(^e: |error:|ERROR|What went wrong|Caused by|Exception|^> |FAILED|not found|Could not)")
          imp = [l for l in linhas if chave.search(l)]
          blocos = [imp[-70:] or linhas[-70:], linhas[-40:]]
          for i, b in enumerate(blocos):
              msg = "\n".join(b)[:30000]
              print(f"::error title=build{i}::" + msg.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY

      - name: Renomear
        run: cp app/build/outputs/apk/release/app-release.apk WebSave.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WebSave
          path: WebSave.apk

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: WebSave 1.0.${{ github.run_number }}
          files: WebSave.apk
