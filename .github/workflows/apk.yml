name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # YouTube needs a JavaScript runtime to unlock every quality; build QuickJS for Android
      - name: Build QuickJS for Android
        run: |
          set -o pipefail
          TAG=$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/quickjs-ng/quickjs/releases/latest | jq -r .tag_name)
          echo "QuickJS-ng $TAG"
          git clone --depth 1 --branch "$TAG" https://github.com/quickjs-ng/quickjs.git qjs-src
          cmake -S qjs-src -B qjs-build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release \
            2>&1 | tee qjs.log
          cmake --build qjs-build --target qjs_exe -j4 2>&1 | tee -a qjs.log \
            || cmake --build qjs-build --target qjs -j4 2>&1 | tee -a qjs.log
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp qjs-build/qjs app/src/main/jniLibs/arm64-v8a/libqjs.so
          file app/src/main/jniLibs/arm64-v8a/libqjs.so

      - name: Build
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Error summary
        if: failure()
        run: |
          python3 - <<'PY'
          import os, re
          lines = []
          for name in ("qjs.log", "build.log"):
              if os.path.exists(name):
                  lines += open(name, errors="ignore").read().splitlines()
          key = re.compile(r"(^e: |error:|ERROR|What went wrong|Caused by|Exception|^> |FAILED|not found|Could not)")
          important = [l for l in lines if key.search(l)]
          for i, block in enumerate([important[-70:] or lines[-70:], lines[-40:]]):
              msg = "\n".join(block)[:30000]
              print(f"::error title=build{i}::" + msg.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk WebSave.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WebSave
          path: WebSave.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: WebSave 1.0.${{ github.run_number }}
          files: WebSave.apk
